name: EvezArt Security Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --verbose --redact --exit-code 1

  detect-secrets:
    name: detect-secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install detect-secrets
        run: python -m pip install detect-secrets
      - name: Scan tracked files
        run: |
          detect-secrets scan --all-files > .secrets.baseline
          python3 -c "
import json, sys
data = json.load(open('.secrets.baseline'))
total = sum(len(v) for v in data.get('results', {}).values())
print(f'Potential secrets: {total}')
if total:
    sys.exit(1)
"

  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Python requirements
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Audit npm dependencies
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=moderate
