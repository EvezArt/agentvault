name: Nightly Vault Sync

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC; review this clock if the intended local time differs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run vault sync
        # Raw local exports are ignored and are not present in a hosted runner checkout.
        # Email notifications are disabled by default in sync_agent.py.
        run: python vault/sync_agent.py
