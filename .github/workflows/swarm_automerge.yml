# .github/workflows/swarm_automerge.yml
# Auto-merge is opt-in, never a default for every owner PR.
# Requires the explicit "swarm" label and at least one approval.

name: Swarm Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    # Never attempt auto-merge directly from a draft-PR event.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge explicitly authorized swarm PRs
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_COMMIT_MESSAGE: pull-request-title-and-description
          MERGE_FILTER_AUTHOR: EvezArt
          MERGE_LABELS: "swarm"
          MERGE_REQUIRED_APPROVALS: 1
          UPDATE_METHOD: rebase
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"
